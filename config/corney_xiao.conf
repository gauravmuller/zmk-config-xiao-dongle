# # Uncomment the following line to enable deep sleep
# CONFIG_ZMK_SLEEP=y

# # Uncomment the following line to increase the keyboard's wireless range
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# # Enable eager debouncing
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# # Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# # CONFIG_ZMK_USB_LOGGING=y

# # Uncomment the following lines to enable the Nice!view Display
# CONFIG_ZMK_DISPLAY=y
# CONFIG_SSD1306=y

# # Disable the WPM widget
# CONFIG_ZMK_WIDGET_WPM_STATUS=n
# # Display battery as n%
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Enable ZMK Studio
CONFIG_ZMK_STUDIO=y

# Enable  battery level reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# Enable display
CONFIG_ZMK_DISPLAY=y

# Enable the SSD1306 OLED driver
CONFIG_SSD1306=y

# Enable  widget to display layer
CONFIG_ZMK_WIDGET_LAYER_STATUS=y

# Enable battery widget
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y

# Show battery percentage
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Enable widget to show output method (USB/BLE)
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# Enable deep sleep support
CONFIG_ZMK_SLEEP=y

# Expose the XIAO's NFC1 pad (P0.09) as a plain GPIO instead of reserving it
# for NFC antenna use -- required because col5 is wired to this pad.
CONFIG_NFCT_PINS_AS_GPIOS=y

# Studio Locking
CONFIG_ZMK_STUDIO_LOCKING=n

# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  # Left half -- peripheral. The Prospector dongle is central, so both
  # halves are forced into the peripheral role regardless of the
  # shield's own Kconfig.defconfig default.
  - board: seeeduino_xiao_ble
    shield: corney_xiao_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corney_xiao_left
  # Right half -- peripheral.
  - board: seeeduino_xiao_ble
    shield: corney_xiao_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corney_xiao_right
  # Prospector dongle -- central. Holds the keymap, pairs with both
  # halves, and drives the Prospector display via the prospector_adapter
  # shield. ZMK Studio lives here since this is the USB-connected part.
  - board: seeeduino_xiao_ble
    shield: corney_xiao_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corney_xiao_dongle
  # Reset firmware -- flash to left, right, and dongle before first pairing
  # (and any time you need to re-pair) so they can bond to each other cleanly.
  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: settings_reset
